<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>絮语 · 字卡传讯</title>
<meta name="description" content="絮语是一个纯本地运行的字卡传讯小工具：写一句话，存成字卡，让 TA 随机说给你听。">
<meta name="theme-color" content="#f6f1e9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23b8562f'/%3E%3Ctext x='32' y='44' font-size='34' font-family='serif' text-anchor='middle' fill='%23fff7ef'%3E絮%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="stage">
  <div id="app" class="app theme-sand" data-view="desktop">

    <!-- ============ 桌面 ============ -->
    <section id="view-desktop" class="view is-active">
      <div class="wallpaper" aria-hidden="true"></div>
      <div class="desk">
        <header class="statusbar">
          <span id="d-clock">--:--</span>
          <span id="d-date"></span>
        </header>

        <div class="hero">
          <p class="hero-eyebrow">絮 语</p>
          <h1 class="hero-title" id="d-greeting">你好</h1>
          <p class="hero-sub">把想说的话，存成一张张字卡。</p>
        </div>

        <div class="widget-grid">
          <div class="widget days-widget">
            <span class="widget-label">在一起</span>
            <p class="days-value"><strong id="d-days">0</strong><span>天</span></p>
            <span class="widget-foot" id="d-since"></span>
          </div>
          <div class="widget note-widget">
            <span class="widget-label">今日字笺</span>
            <p id="d-today-card">……</p>
          </div>
        </div>

        <div class="desk-section">
          <div class="section-head">
            <span>联系人</span>
            <button type="button" class="text-btn" id="d-manage">管理</button>
          </div>
          <div id="d-contacts" class="contact-strip"></div>
        </div>

        <nav class="dock" aria-label="快捷入口">
          <button type="button" class="dock-item" data-go="contacts">
            <span class="dock-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v10H9l-5 4V6z"/></svg>
            </span>
            <span class="dock-label">消息</span>
            <span class="badge" id="d-badge-msg" hidden></span>
          </button>
          <button type="button" class="dock-item" data-go="cards">
            <span class="dock-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="12" height="14" rx="2"/><path d="M8 6V4h12v14h-2"/></svg>
            </span>
            <span class="dock-label">字卡</span>
          </button>
          <button type="button" class="dock-item" data-go="settings">
            <span class="dock-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
            </span>
            <span class="dock-label">设置</span>
          </button>
        </nav>
      </div>
    </section>

    <!-- ============ 消息列表 ============ -->
    <section id="view-contacts" class="view">
      <header class="topbar">
        <button type="button" class="icon-btn" data-back="desktop" aria-label="返回">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <h2>消息</h2>
        <button type="button" class="icon-btn" id="btn-add-contact" aria-label="添加联系人">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </header>
      <div class="page-body">
        <div id="contact-list" class="contact-list"></div>
        <div id="contact-empty" class="empty-state" hidden>
          <p>还没有联系人。</p>
          <button type="button" class="btn primary" id="btn-add-contact-2">添加第一个联系人</button>
        </div>
      </div>
    </section>

    <!-- ============ 聊天 ============ -->
    <section id="view-chat" class="view">
      <header class="topbar chat-topbar">
        <button type="button" class="icon-btn" data-back="contacts" aria-label="返回">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="chat-peer">
          <span class="avatar sm" id="c-avatar">🙂</span>
          <div class="chat-peer-text">
            <strong id="c-name">TA</strong>
            <span id="c-note"></span>
          </div>
        </div>
        <button type="button" class="icon-btn" id="btn-clear-chat" aria-label="清空对话" title="清空对话">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg>
        </button>
      </header>
      <div id="chat-scroll" class="chat-scroll">
        <div class="chat-hint">对话只保存在这台设备上</div>
        <div id="chat-list" class="chat-list"></div>
      </div>
      <form id="composer" class="composer">
        <textarea id="msg-input" rows="1" maxlength="500" placeholder="说点什么…" aria-label="输入消息"></textarea>
        <button type="submit" class="send-btn" aria-label="发送">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-7-7 16-2.2-6.8L4 12z"/></svg>
        </button>
      </form>
    </section>

    <!-- ============ 字卡库 ============ -->
    <section id="view-cards" class="view">
      <header class="topbar">
        <button type="button" class="icon-btn" data-back="desktop" aria-label="返回">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <h2>字卡库</h2>
        <button type="button" class="icon-btn" id="btn-add-card" aria-label="新建字卡">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </header>
      <div class="page-body">
        <div class="searchbar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>
          <input id="card-search" type="search" placeholder="搜索字卡内容或触发词…" aria-label="搜索字卡">
        </div>
        <div id="card-cats" class="chips"></div>
        <div class="card-tools">
          <button type="button" class="tool-btn" id="btn-import-cards">导入</button>
          <button type="button" class="tool-btn" id="btn-export-cards">导出</button>
          <button type="button" class="tool-btn" id="btn-restore-cards">恢复内置</button>
          <input type="file" id="file-import-cards" accept="application/json,.json" hidden>
        </div>
        <div id="card-list" class="card-list"></div>
        <p id="card-count" class="list-meta"></p>
      </div>
    </section>

    <!-- ============ 设置 ============ -->
    <section id="view-settings" class="view">
      <header class="topbar">
        <button type="button" class="icon-btn" data-back="desktop" aria-label="返回">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <h2>设置</h2>
        <span class="topbar-spacer"></span>
      </header>
      <div class="page-body">
        <div class="panel">
          <h3>我的资料</h3>
          <label class="field"><span>名字</span><input id="set-name" maxlength="12" placeholder="你的名字"></label>
          <label class="field"><span>头像</span><input id="set-avatar" maxlength="4" placeholder="一个 emoji"></label>
          <label class="field"><span>纪念日</span><input id="set-since" type="date"></label>
        </div>

        <div class="panel">
          <h3>外观</h3>
          <div class="theme-row" id="theme-row">
            <button type="button" class="theme-chip" data-theme="sand"><i style="--sw:#e2c3a5"></i>暖沙</button>
            <button type="button" class="theme-chip" data-theme="mist"><i style="--sw:#b9cfd2"></i>雾青</button>
            <button type="button" class="theme-chip" data-theme="rose"><i style="--sw:#dfb3bc"></i>暮粉</button>
            <button type="button" class="theme-chip" data-theme="night"><i style="--sw:#3b4252"></i>夜色</button>
          </div>
        </div>

        <div class="panel">
          <h3>回复</h3>
          <div class="field-row">
            <label class="field"><span>每句话最少</span><input id="set-min" type="number" min="0" max="5" step="1"></label>
            <label class="field"><span>最多</span><input id="set-max" type="number" min="0" max="5" step="1"></label>
          </div>
          <label class="field"><span>打字停顿</span>
            <select id="set-typing">
              <option value="400">快</option>
              <option value="700">正常</option>
              <option value="1100">慢</option>
            </select>
          </label>
          <p class="panel-note">消息里出现字卡的触发词时，那张卡会被优先说出。</p>
        </div>

        <div class="panel">
          <h3>数据</h3>
          <p class="panel-note">所有内容只保存在本机浏览器，不会上传。换设备或清理缓存前，请先导出备份。</p>
          <div class="btn-row">
            <button type="button" class="btn" id="btn-export-all">导出备份</button>
            <button type="button" class="btn" id="btn-import-all">导入备份</button>
          </div>
          <button type="button" class="btn danger" id="btn-reset">清空并重置</button>
          <p class="list-meta" id="storage-size"></p>
          <input type="file" id="file-import-all" accept="application/json,.json" hidden>
        </div>

        <p class="about-note">絮语 1.0 · 字卡传讯<br>纯本地运行，安静地存放你和 TA 的对话。</p>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- ============ 字卡弹窗 ============ -->
<dialog id="card-dialog" class="sheet">
  <form id="card-form">
    <div class="sheet-head">
      <h3 id="card-dialog-title">新建字卡</h3>
      <button type="button" class="icon-btn" data-close aria-label="关闭">×</button>
    </div>
    <label class="field">
      <span>内容</span>
      <textarea id="card-text" rows="3" maxlength="200" placeholder="写一句想被随机说出口的话…" required></textarea>
    </label>
    <label class="field"><span>分类</span><select id="card-cat"></select></label>
    <label class="field"><span>触发词（可选）</span><input id="card-trigger" maxlength="10" placeholder="消息里出现这个词时优先使用"></label>
    <div class="sheet-actions">
      <button type="button" class="btn ghost" data-close>取消</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</dialog>

<!-- ============ 联系人弹窗 ============ -->
<dialog id="contact-dialog" class="sheet">
  <form id="contact-form">
    <div class="sheet-head">
      <h3 id="contact-dialog-title">新建联系人</h3>
      <button type="button" class="icon-btn" data-close aria-label="关闭">×</button>
    </div>
    <label class="field"><span>名字</span><input id="contact-name" maxlength="12" placeholder="TA 的名字" required></label>
    <label class="field"><span>头像</span><input id="contact-avatar" maxlength="4" placeholder="一个 emoji"></label>
    <label class="field"><span>备注</span><input id="contact-note" maxlength="20" placeholder="一句话介绍（可选）"></label>
    <div class="sheet-actions">
      <button type="button" class="btn danger ghost" id="contact-delete" hidden>删除</button>
      <span class="sheet-spacer"></span>
      <button type="button" class="btn ghost" data-close>取消</button>
      <button type="submit" class="btn primary">保存</button>
    </div>
  </form>
</dialog>
  </div>
</div>

<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/desktop.js"></script>
<script src="js/chat.js"></script>
<script src="js/cards.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
